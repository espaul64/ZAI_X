name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 删除了多余报错的 pod install 步骤，flutter 会自己处理
      
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build macOS (Apple Silicon Only)
        # 核心：加上 --target-platform=macos-arm64，只打包 arm64，体积减半
        run: flutter build macos --release --target-platform=macos-arm64

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-arm64
          path: build/macos/Build/Products/Release/
