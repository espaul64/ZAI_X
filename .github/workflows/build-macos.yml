name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build macOS (Release)
        run: flutter build macos --release

      # 1. 清理调试符号
      - name: Clean up dSYM files
        run: |
          find build/macos/Build/Products/Release -name "*.dSYM" -exec rm -rf {} +

      # 2. 剔除 Intel (x86_64) 架构，只保留 Apple Silicon (arm64)
      - name: Strip x86_64 Architecture (Make it Apple Silicon Only)
        run: |
          echo "Slimming down .app to arm64 only..."
          find build/macos/Build/Products/Release -type f | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              lipo -remove x86_64 "$file" -output "$file" 2>/dev/null || true
            fi
          done
          echo "Done!"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-arm64
          path: build/macos/Build/Products/Release/
